name: Build DashCore Experimental Renderer (Android64)

on:
  push:
    branches: ["experimental-renderer"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: dashcore-experimental-renderer-android64
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Launcher Diagnostics analyzer
        run: |
          python3 -m py_compile scripts/analyze_launcher_diagnostics.py scripts/test_launcher_diagnostics_analyzer.py
          python3 -m unittest discover -s scripts -p 'test_launcher_diagnostics_analyzer.py' -v

      - name: Validate cloud AutoTest fixture and runtime parsers
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 -m py_compile \
            scripts/autotest_ab.py \
            scripts/autotest_gameplay_diagnostics.py \
            scripts/build_autotest_level.py \
            scripts/test_autotest_level_builder.py \
            scripts/test_gameplay_diagnostics_autotest.py \
            scripts/autotest_geode.py \
            scripts/test_autotest_navigation.py
          python3 scripts/test_autotest_level_builder.py
          python3 scripts/test_gameplay_diagnostics_autotest.py
          python3 scripts/test_autotest_navigation.py

      - name: Run renderer contract and host-model tests
        run: |
          python3 -m py_compile scripts/test_renderer_product_contract.py
          python3 scripts/test_renderer_product_contract.py
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/renderer_model_tests.cpp src/renderer/core/*.cpp -o /tmp/dashcore-renderer-model-tests
          /tmp/dashcore-renderer-model-tests
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/renderer_diagnostics_tests.cpp src/renderer/core/RendererDiagnostics.cpp -o /tmp/dashcore-renderer-diagnostics-tests
          /tmp/dashcore-renderer-diagnostics-tests

      - name: Run Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --error-exitcode=1 \
            --language=c++ \
            --std=c++20 \
            --suppress=missingIncludeSystem \
            src/renderer

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod for Android64
        id: build
        uses: ./.github/actions/build-geode-mod
        with:
          target: Android64
          sdk: given
          android-min-sdk: 29
          build-config: Release
          use-lto: false

      - name: Build diagnostics
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          echo "## Experimental renderer Android64 build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build outcome: **$BUILD_OUTCOME**" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BUILD_OUTPUT" ] && [ -d "$BUILD_OUTPUT" ]; then
            find "$BUILD_OUTPUT" -maxdepth 2 -type f -name '*.geode' -print -exec stat -c 'Artifact size: %s bytes' {} +
          else
            echo "Build output directory was not produced."
          fi

      - name: Upload Android64 package
        uses: actions/upload-artifact@v4
        with:
          name: DashCore-Experimental-Renderer-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

      - name: Trigger trusted cloud AutoTest on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          workflow = "autotest-v3-cloud.yml"
          payload = {
              "ref": "main",
              "inputs": {
                  "build_branch": "experimental-renderer",
                  "build_run_id": os.environ["BUILD_RUN_ID"],
              },
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/{workflow}/dispatches",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f"Unexpected workflow dispatch status: {response.status}")
          print("Dispatched trusted AutoTest workflow on main.")
          PY
