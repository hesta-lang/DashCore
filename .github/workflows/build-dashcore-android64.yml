name: Build DashCore Experimental Renderer (Android64)

on:
  push:
    branches: ["experimental-renderer"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: dashcore-experimental-renderer-android64
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run renderer contract and host-model tests
        run: |
          python3 -m py_compile scripts/test_renderer_product_contract.py
          python3 scripts/test_renderer_product_contract.py
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/renderer_model_tests.cpp src/renderer/core/*.cpp -o /tmp/dashcore-renderer-model-tests
          /tmp/dashcore-renderer-model-tests

      - name: Run Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --error-exitcode=1 \
            --language=c++ \
            --std=c++20 \
            --suppress=missingIncludeSystem \
            src/renderer

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod for Android64
        id: build
        uses: ./.github/actions/build-geode-mod
        with:
          target: Android64
          sdk: given
          android-min-sdk: 29
          build-config: Release
          use-lto: false

      - name: Build diagnostics
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          echo "## Experimental renderer Android64 build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build outcome: **$BUILD_OUTCOME**" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BUILD_OUTPUT" ] && [ -d "$BUILD_OUTPUT" ]; then
            find "$BUILD_OUTPUT" -maxdepth 2 -type f -name '*.geode' -print -exec stat -c 'Artifact size: %s bytes' {} \;
          else
            echo "Build output directory was not produced."
          fi

      - name: Upload Android64 package
        uses: actions/upload-artifact@v4
        with:
          name: DashCore-Experimental-Renderer-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
