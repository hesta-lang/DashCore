name: DashCore Android64 Object Grouping Build

on:
  push:
    branches: ["android-object-grouping"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android64:
    name: Build Geode mod for Android64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          android-min-sdk: "29"
          build-config: Release

      - name: Upload Android64 .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashCore-0.16.0-alpha-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
