name: DashCore AutoTest - Generated level on cloud emulator

on:
  workflow_run:
    workflows: ["Build DashCore (Android64)"]
    types: [completed]
    branches: [experimental-renderer]
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: "MediaFire file-page URL for your authorized Geometry Dash 2.2081 APK. Can also be supplied as GEOMETRY_DASH_MEDIAFIRE_URL secret."
        required: false
        default: "https://www.mediafire.com/file/o9rk5i69nmu0nci/Geometry+Dash_2.2081.apk/file"
        type: string
      build_run_id:
        description: "Optional successful DashCore Android64 build run ID; empty selects the latest successful build on this branch."
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dashcore-autotest-gameplay-diagnostics
  cancel-in-progress: true

jobs:
  cloud-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Play Geometry Dash once and collect DashCore diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEOMETRY_DASH_MEDIAFIRE_URL: ${{ inputs.mediafire_url || secrets.GEOMETRY_DASH_MEDIAFIRE_URL || 'https://www.mediafire.com/file/o9rk5i69nmu0nci/Geometry+Dash_2.2081.apk/file' }}
      REPORT_DIR: reports/autotest-gameplay-diagnostics
    steps:
      - name: Select DashCore build artifact and exact source revision
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          BUILD_BRANCH: ${{ github.ref_name }}
          INPUT_BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ -z "$BUILD_RUN_ID" ] || [ -z "$BUILD_RUN_SHA" ]; then
              echo "::error::The triggering build run ID or source SHA is missing."
              exit 1
            fi
            echo "run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "head_sha=$BUILD_RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["BUILD_BRANCH"]
          requested = os.environ.get("INPUT_BUILD_RUN_ID", "").strip()
          if not branch or branch == "main":
              raise SystemExit("Run this AutoTest from experimental-renderer, not main.")
          base = f"https://api.github.com/repos/{repo}/actions"
          headers = {"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}"}
          if requested:
              url = f"{base}/runs/{requested}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  selected = json.load(response)
              if selected.get("head_branch") != branch or selected.get("conclusion") != "success":
                  raise SystemExit("The supplied build run must be successful and belong to this branch.")
              if selected.get("path", "").endswith("build-dashcore-android64.yml") is False:
                  raise SystemExit("The supplied run is not the DashCore Android64 build workflow.")
          else:
              from urllib.parse import quote
              url = (f"{base}/workflows/build-dashcore-android64.yml/runs"
                     f"?branch={quote(branch, safe='')}&status=success&per_page=20")
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  runs = json.load(response).get("workflow_runs", [])
              if not runs:
                  raise SystemExit(f"No successful Android64 build found on {branch}.")
              selected = runs[0]
          print(f"run_id={selected['id']}")
          print(f"head_sha={selected['head_sha']}")
          PY
          fi

      - name: Checkout exact source revision used by the build
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.head_sha }}

      - name: Prepare Android platform tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - name: Download and validate DashCore package
        uses: actions/download-artifact@v4
        with:
          name: OptGod-Android64
          path: artifacts/mod
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build.outputs.run_id }}

      - name: Validate .geode package
        run: |
          set -euo pipefail
          python3 scripts/autotest_geode.py --artifact-dir artifacts/mod --report-dir reports/package

      - name: Locate latest Geode Launcher build
        id: launcher-build
        env:
          ANDROID_LAUNCHER_TOKEN: ${{ secrets.ANDROID_LAUNCHER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_LAUNCHER_TOKEN" ]; then
            echo "::error::Missing ANDROID_LAUNCHER_TOKEN (Actions: read on hesta-lang/android-launcher)."
            exit 1
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          token = os.environ["ANDROID_LAUNCHER_TOKEN"]
          url = "https://api.github.com/repos/hesta-lang/android-launcher/actions/workflows/build.yml/runs?branch=spotify-app-remote-integration&status=success&per_page=1"
          request = urllib.request.Request(url, headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}"})
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])
          if not runs:
              raise SystemExit("No successful launcher build found on spotify-app-remote-integration.")
          print(f"run_id={runs[0]['id']}")
          PY

      - name: Download Geode Launcher APK
        uses: actions/download-artifact@v4
        with:
          name: geode-launcher-release
          path: artifacts/launcher
          github-token: ${{ secrets.ANDROID_LAUNCHER_TOKEN }}
          repository: hesta-lang/android-launcher
          run-id: ${{ steps.launcher-build.outputs.run_id }}

      - name: Prepare authorized Geometry Dash APK
        run: |
          set -euo pipefail
          mkdir -p test-input "$REPORT_DIR"
          APK="$(find artifacts/launcher -type f -name 'geode-launcher-release-*.apk' ! -name '*android32*' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Universal Geode Launcher APK not found."
            exit 1
          fi
          cp "$APK" test-input/geode-launcher.apk
          if [ -z "$GEOMETRY_DASH_MEDIAFIRE_URL" ]; then
            echo "::error::No authorized Geometry Dash APK URL was supplied."
            exit 1
          fi
          python3 scripts/download_mediafire_apk.py \
            --url "$GEOMETRY_DASH_MEDIAFIRE_URL" \
            --output test-input/geometry-dash.apk \
            --report "$REPORT_DIR/mediafire-download.json"

      - name: Start Android 11 cloud device
        id: cloud
        uses: emulator-wtf/actions/use-emulator@v1.2.6
        with:
          api-token: ${{ secrets.EW_API_TOKEN }}
          devices: |
            model=Pixel2,version=30
          max-time-limit: 25m
          record-video: true
          outputs-dir: reports/autotest-gameplay-diagnostics/cloud-session

      - name: Install APKs and prepare the test device
        id: device
        env:
          ADB_PORTS: ${{ steps.cloud.outputs.adb_attached }}
        run: |
          set -euo pipefail
          if [ -z "$ADB_PORTS" ]; then
            echo "::error::Cloud device did not provide an ADB port."
            exit 1
          fi
          while IFS= read -r port; do
            [ -n "$port" ] && adb connect "127.0.0.1:$port"
          done < <(printf '%s' "$ADB_PORTS" | tr ',' '\n')
          SERIAL="$(adb devices | awk '$2=="device"{print $1;exit}')"
          [ -n "$SERIAL" ] || { echo "::error::No connected Android device."; exit 1; }
          adb -s "$SERIAL" wait-for-device
          prop() { adb -s "$SERIAL" shell getprop "$1" | tr -d '\r'; }
          SDK="$(prop ro.build.version.sdk)"
          ABIS="$(prop ro.product.cpu.abilist)"
          BRIDGE="$(prop ro.dalvik.vm.native.bridge)"
          {
            echo "Android SDK: $SDK"
            echo "Supported ABIs: $ABIS"
            echo "Native bridge: $BRIDGE"
          } | tee "$REPORT_DIR/device.txt"
          if [ "$SDK" -lt 29 ] || ! printf '%s' "$ABIS" | grep -q 'arm64-v8a' || [ -z "$BRIDGE" ] || [ "$BRIDGE" = "0" ]; then
            echo "::error::Cloud device does not meet Android 10+ ARM64 translation requirements."
            exit 1
          fi
          adb -s "$SERIAL" install -r test-input/geode-launcher.apk | tee "$REPORT_DIR/launcher-install.txt"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging test-input/geometry-dash.apk)"
          printf '%s\n' "$BADGING" > "$REPORT_DIR/game-apk-badging.txt"
          GAME_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          GAME_VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          if [ -z "$GAME_PACKAGE" ] || [ "$GAME_VERSION" != "2.2.144" ]; then
            echo "::error::Expected authorized Android Geometry Dash 2.2.144 APK; found package=$GAME_PACKAGE version=$GAME_VERSION."
            exit 1
          fi
          adb -s "$SERIAL" install -r test-input/geometry-dash.apk | tee "$REPORT_DIR/game-install.txt"
          adb -s "$SERIAL" shell pm path "$GAME_PACKAGE" | grep '^package:' >/dev/null
          echo "Game package: $GAME_PACKAGE; versionName: $GAME_VERSION" | tee "$REPORT_DIR/game-version.txt"
          echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"
          echo "game_package=$GAME_PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Install gameplay screenshot OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python3 -m pip install --disable-pip-version-check pillow


      - name: Initialize Geometry Dash and inject deterministic AutoTest level
        id: fixture
        env:
          SERIAL: ${{ steps.device.outputs.serial }}
          GAME_PACKAGE: ${{ steps.device.outputs.game_package }}
        run: |
          set -euo pipefail
          mkdir -p test-input reports/autotest-level
          adb -s "$SERIAL" root
          adb -s "$SERIAL" wait-for-device
          DEVICE_ID="$(adb -s "$SERIAL" shell id | tr -d '\\r')"
          echo "$DEVICE_ID" | tee reports/autotest-level/adb-root.txt
          if ! echo "$DEVICE_ID" | grep -q 'uid=0'; then
            echo "::error::The cloud emulator did not grant adb root; the test level cannot be installed into Geometry Dash's private save."
            exit 1
          fi

          # A first game launch creates its private save directory on a clean emulator.
          adb -s "$SERIAL" shell am start -a android.intent.action.VIEW -d geode-launcher://main/launch -p com.geode.launcher || true
          sleep 25
          adb -s "$SERIAL" shell am force-stop com.geode.launcher || true

          SAVE_PATH="$(adb -s "$SERIAL" shell "find /data/user/0 /data/data /sdcard/Android/media -type f -name CCLocalLevels.dat 2>/dev/null | head -n 1" | tr -d '\\r')"
          if [ -n "$SAVE_PATH" ]; then
            SAVE_DIR="$(dirname "$SAVE_PATH")"
            adb -s "$SERIAL" pull "$SAVE_PATH" test-input/CCLocalLevels.original.dat
            python3 scripts/build_autotest_level.py \
              --input test-input/CCLocalLevels.original.dat \
              --output test-input/CCLocalLevels.autotest.dat \
              --summary reports/autotest-level/autotest-level.json
          else
            MANAGER_PATH="$(adb -s "$SERIAL" shell "find /data/user/0 /data/data /sdcard/Android/media -type f -name CCGameManager.dat 2>/dev/null | head -n 1" | tr -d '\\r')"
            if [ -n "$MANAGER_PATH" ]; then
              SAVE_DIR="$(dirname "$MANAGER_PATH")"
            else
              SAVE_DIR="/data/user/0/$GAME_PACKAGE/files"
            fi
            adb -s "$SERIAL" shell "test -d '$SAVE_DIR'" || {
              echo "::error::Could not locate the Geometry Dash private save directory after first launch."
              exit 1
            }
            python3 scripts/build_autotest_level.py \
              --output test-input/CCLocalLevels.autotest.dat \
              --summary reports/autotest-level/autotest-level.json
            SAVE_PATH="$SAVE_DIR/CCLocalLevels.dat"
          fi

          OWNER="$(adb -s "$SERIAL" shell "stat -c '%u:%g' '$SAVE_DIR'" | tr -d '\\r')"
          if [ -z "$OWNER" ]; then
            echo "::error::Could not determine the Geometry Dash save-directory owner."
            exit 1
          fi
          adb -s "$SERIAL" push test-input/CCLocalLevels.autotest.dat "$SAVE_PATH"
          adb -s "$SERIAL" shell "chown '$OWNER' '$SAVE_PATH' && chmod 600 '$SAVE_PATH'"
          EXPECTED_SHA="$(python3 -c 'import json; print(json.load(open("reports/autotest-level/autotest-level.json"))["output_sha256"])')"
          ACTUAL_SHA="$(adb -s "$SERIAL" shell "sha256sum '$SAVE_PATH'" | awk '{print $1}' | tr -d '\\r')"
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "::error::Installed CCLocalLevels.dat checksum does not match generated fixture."
            exit 1
          fi
          {
            echo "save_path=$SAVE_PATH"
            echo "save_owner=$OWNER"
            echo "save_sha256=$ACTUAL_SHA"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Installed local level: DashCore AutoTest"
            echo "Save path: $SAVE_PATH"
            echo "Owner: $OWNER"
            echo "SHA-256: $ACTUAL_SHA"
          } | tee reports/autotest-level/install.txt

      - name: Validate generated-level AutoTest and histogram parser
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/autotest_ab.py scripts/autotest_gameplay_diagnostics.py scripts/build_autotest_level.py scripts/test_autotest_level_builder.py scripts/test_gameplay_diagnostics_autotest.py
          python3 scripts/test_autotest_level_builder.py
          python3 scripts/test_gameplay_diagnostics_autotest.py
          python3 scripts/test_render_pipeline_contract.py

      - name: Run one gameplay session and collect diagnostics
        env:
          SERIAL: ${{ steps.device.outputs.serial }}
        run: |
          set -euo pipefail
          MOD="$(find artifacts/mod -type f -name '*.geode' -print -quit)"
          [ -n "$MOD" ] || { echo "::error::DashCore .geode artifact missing."; exit 1; }
          python3 scripts/autotest_gameplay_diagnostics.py \
            --serial "$SERIAL" \
            --mod-file "$MOD" \
            --base-dir /sdcard/Android/media/com.geode.launcher \
            --report-dir "$REPORT_DIR" \
            --level-name "DashCore AutoTest" \
            --level-manifest reports/autotest-level/autotest-level.json \
            --observation-seconds 20

      - name: Upload gameplay diagnostics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DashCore-AutoTest-Cloud-${{ github.run_number }}
          path: |
            reports/
            artifacts/mod/
          if-no-files-found: warn
          retention-days: 30
