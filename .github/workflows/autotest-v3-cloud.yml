
name: DashCore AutoTest - FPS Without Mod vs With DashCore

on:
  workflow_run:
    workflows: ["Build OptGod (Android64)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mediafire_url:
        description: "MediaFire file-page URL for your authorized Geometry Dash APK. Can also be supplied as GEOMETRY_DASH_MEDIAFIRE_URL secret."
        required: false
        default: "https://www.mediafire.com/file/o9rk5i69nmu0nci/Geometry+Dash_2.2081.apk/file"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dashcore-autotest-fps
  cancel-in-progress: true

jobs:
  cloud-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Measure FPS without DashCore and with DashCore on the same Android device
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEOMETRY_DASH_MEDIAFIRE_URL: ${{ inputs.mediafire_url || secrets.GEOMETRY_DASH_MEDIAFIRE_URL || 'https://www.mediafire.com/file/o9rk5i69nmu0nci/Geometry+Dash_2.2081.apk/file' }}
      REPORT_DIR: reports/autotest-fps
    steps:
      - name: Select DashCore build artifact and exact source revision
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ -z "$BUILD_RUN_ID" ] || [ -z "$BUILD_RUN_SHA" ]; then
              echo "::error::The triggering build run ID or source SHA is missing."
              exit 1
            fi
            echo "run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "head_sha=$BUILD_RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/build-android64.yml/runs?branch=main&status=success&per_page=20"
          req = urllib.request.Request(url, headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}"})
          with urllib.request.urlopen(req, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])
          if not runs:
              raise SystemExit("No successful Android64 build found on main.")
          selected = runs[0]
          print(f"run_id={selected['id']}")
          print(f"head_sha={selected['head_sha']}")
          PY
          fi

      - name: Checkout exact source revision used by the build
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.head_sha }}

      - name: Prepare Android platform tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'

      - name: Download and validate DashCore package
        uses: actions/download-artifact@v4
        with:
          name: OptGod-Android64
          path: artifacts/mod
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build.outputs.run_id }}

      - name: Validate .geode package
        run: |
          set -euo pipefail
          python3 scripts/autotest_geode.py --artifact-dir artifacts/mod --report-dir reports/package

      - name: Locate latest Geode Launcher build
        id: launcher-build
        env:
          ANDROID_LAUNCHER_TOKEN: ${{ secrets.ANDROID_LAUNCHER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_LAUNCHER_TOKEN" ]; then
            echo "::error::Missing ANDROID_LAUNCHER_TOKEN (Actions: read on hesta-lang/android-launcher)."
            exit 1
          fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          token = os.environ["ANDROID_LAUNCHER_TOKEN"]
          url = "https://api.github.com/repos/hesta-lang/android-launcher/actions/workflows/build.yml/runs?branch=spotify-app-remote-integration&status=success&per_page=1"
          request = urllib.request.Request(url, headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}"})
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])
          if not runs:
              raise SystemExit("No successful launcher build found on spotify-app-remote-integration.")
          print(f"run_id={runs[0]['id']}")
          PY

      - name: Download Geode Launcher APK
        uses: actions/download-artifact@v4
        with:
          name: geode-launcher-release
          path: artifacts/launcher
          github-token: ${{ secrets.ANDROID_LAUNCHER_TOKEN }}
          repository: hesta-lang/android-launcher
          run-id: ${{ steps.launcher-build.outputs.run_id }}

      - name: Prepare authorized Geometry Dash APK
        run: |
          set -euo pipefail
          mkdir -p test-input "$REPORT_DIR"
          APK="$(find artifacts/launcher -type f -name 'geode-launcher-release-*.apk' ! -name '*android32*' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Universal Geode Launcher APK not found."
            exit 1
          fi
          cp "$APK" test-input/geode-launcher.apk
          if [ -z "$GEOMETRY_DASH_MEDIAFIRE_URL" ]; then
            echo "::error::No authorized Geometry Dash APK URL was supplied."
            exit 1
          fi
          python3 scripts/download_mediafire_apk.py \
            --url "$GEOMETRY_DASH_MEDIAFIRE_URL" \
            --output test-input/geometry-dash.apk \
            --report "$REPORT_DIR/mediafire-download.json"

      - name: Start Android 11 cloud device
        id: cloud
        uses: emulator-wtf/actions/use-emulator@v1.2.6
        with:
          api-token: ${{ secrets.EW_API_TOKEN }}
          devices: |
            model=Pixel2,version=30
          max-time-limit: 25m
          record-video: true
          outputs-dir: reports/autotest-fps/cloud-session

      - name: Install APKs and prepare the test device
        id: device
        env:
          ADB_PORTS: ${{ steps.cloud.outputs.adb_attached }}
        run: |
          set -euo pipefail
          if [ -z "$ADB_PORTS" ]; then
            echo "::error::Cloud device did not provide an ADB port."
            exit 1
          fi
          IFS=',' read -ra PORTS <<< "$ADB_PORTS"
          for port in "${PORTS[@]}"; do adb connect "127.0.0.1:$port"; done
          SERIAL="$(adb devices | awk '$2=="device"{print $1;exit}')"
          [ -n "$SERIAL" ] || { echo "::error::No connected Android device."; exit 1; }
          adb -s "$SERIAL" wait-for-device
          prop() { adb -s "$SERIAL" shell getprop "$1" | tr -d '\r'; }
          SDK="$(prop ro.build.version.sdk)"
          ABI="$(prop ro.product.cpu.abi)"
          ABIS="$(prop ro.product.cpu.abilist)"
          BRIDGE="$(prop ro.dalvik.vm.native.bridge)"
          {
            echo "Android SDK: $SDK"
            echo "Primary ABI: $ABI"
            echo "Supported ABIs: $ABIS"
            echo "Native bridge: ${BRIDGE:-<empty>}"
          } | tee "$REPORT_DIR/device.txt"
          if [ "$SDK" -lt 29 ] || ! printf '%s' "$ABIS" | grep -q 'arm64-v8a' || [ -z "$BRIDGE" ] || [ "$BRIDGE" = "0" ]; then
            echo "::error::Cloud device does not meet Android 10+ ARM64 translation requirements."
            exit 1
          fi
          adb -s "$SERIAL" install -r test-input/geode-launcher.apk | tee "$REPORT_DIR/launcher-install.txt"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging test-input/geometry-dash.apk)"
          printf '%s\n' "$BADGING" > "$REPORT_DIR/game-apk-badging.txt"
          GAME_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          GAME_VERSION="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          if [ -z "$GAME_PACKAGE" ] || [ "$GAME_VERSION" != "2.2.144" ]; then
            echo "::error::Expected authorized Android Geometry Dash 2.2.144 APK; found package=$GAME_PACKAGE version=$GAME_VERSION."
            exit 1
          fi
          adb -s "$SERIAL" install -r test-input/geometry-dash.apk | tee "$REPORT_DIR/game-install.txt"
          adb -s "$SERIAL" shell pm path "$GAME_PACKAGE" | grep '^package:' >/dev/null
          echo "Game package: $GAME_PACKAGE; versionName: $GAME_VERSION" | tee "$REPORT_DIR/game-version.txt"
          echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"

      - name: Install benchmark image reader and OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python3 -m pip install --disable-pip-version-check pillow

      - name: Validate FPS benchmark script and timestamp parser
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/autotest_ab.py
          python3 - <<'PY'
          import importlib.util
          from PIL import Image, ImageDraw
          spec = importlib.util.spec_from_file_location("autotest_ab", "scripts/autotest_ab.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          period = 16_666_667
          rows = ["16666667"]
          rows += [f"{i*period} {i*period} {i*period}" for i in range(1, 20)]
          rows += [f"{2**63-1} {2**63-1} {2**63-1}"]
          parsed = module.parse_surfaceflinger_latency("\n".join(rows))
          assert parsed.get("available") is True, parsed
          assert parsed["frame_count"] == 19, parsed
          assert 59.0 <= parsed["average_fps"] <= 61.0, parsed
          invalid = module.parse_surfaceflinger_latency(
              "16666667\\n" + "\n".join([f"{2**63-1} {2**63-1} {2**63-1}"] * 20)
          )
          assert invalid.get("available") is False, invalid
          notice = Image.new("RGB", (1920, 1080), (12, 40, 10))
          ImageDraw.Draw(notice).rectangle((880, 752, 1040, 832), fill=(89, 220, 29))
          center = module.detect_notice_ok_button(notice)
          assert center is not None and abs(center[0] - 960) <= 3 and abs(center[1] - 792) <= 3, center
          print("SurfaceFlinger timestamp parser self-test passed.")
          print(f"Geometry Dash NOTICE button detector self-test passed: {center}.")
          PY

      - name: Run baseline vs DashCore FPS benchmark
        env:
          SERIAL: ${{ steps.device.outputs.serial }}
        run: |
          set -euo pipefail
          MOD="$(find artifacts/mod -type f -name '*.geode' -print -quit)"
          [ -n "$MOD" ] || { echo "::error::DashCore .geode artifact missing."; exit 1; }
          python3 scripts/autotest_ab.py \
            --serial "$SERIAL" \
            --mod-file "$MOD" \
            --base-dir /sdcard/Android/media/com.geode.launcher \
            --report-dir "$REPORT_DIR"

      - name: Upload AutoTest v4.3 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DashCore-FPS-Benchmark-${{ github.run_number }}
          path: |
            reports/
            artifacts/
          if-no-files-found: warn
          retention-days: 30
