name: Build OptGod (Android64)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod for Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given
          android-min-sdk: 29
          build-config: Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptGod-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
