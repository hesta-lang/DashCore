name: Build OptGod (Android64)

on:
  push:
    branches: ["**"]
    # The .geode artifact is unchanged by documentation-only edits.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
  workflow_dispatch:

# Avoid spending free Actions minutes on obsolete builds from the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod for Android64
        id: build
        uses: ./.github/actions/build-geode-mod
        with:
          target: Android64
          sdk: given
          android-min-sdk: 29
          build-config: Release
          # LTO increases link time; disable it for faster CI builds.
          # Runtime behavior is unchanged; the resulting binary may be slightly larger.
          use-lto: false

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: OptGod-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

  analyze-logs:
    name: Analyze build logs
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      actions: read
    steps:
      - name: Summarize build logs and timings
        uses: SKCloudOps/action-log-analyzer@353bafb5ab6b49dfbf47f9803d84a982603234a9
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          post-comment: false
          post-summary: true
