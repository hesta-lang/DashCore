name: DashCore AutoTest v2 - Android Runtime

on:
  workflow_run:
    workflows: ["Build OptGod (Android64)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      launcher_apk_url:
        description: "Optional direct HTTPS URL for a Geode Launcher universal ARM APK. Leave empty to download the latest launcher Actions artifact using ANDROID_LAUNCHER_TOKEN."
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dashcore-runtime-autotest
  cancel-in-progress: true

jobs:
  android-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Install, launch and inspect DashCore on Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAUNCHER_APK_URL: ${{ inputs.launcher_apk_url }}
      PACKAGE_NAME: com.geode.launcher
      REPORT_DIR: reports/runtime
      ARTIFACT_DIR: artifacts

    steps:
      - name: Checkout AutoTest scripts
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select completed DashCore build
        id: triggered-build
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: echo "run_id=$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Find latest successful DashCore build for manual run
        id: latest-build
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/build-android64.yml/runs?branch=main&status=success&per_page=1"
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          runs = data.get("workflow_runs", [])
          if not runs:
              raise SystemExit("No successful Android64 build found on main.")
          print(f"run_id={runs[0]['id']}")
          PY

      - name: Download DashCore .geode artifact
        uses: actions/download-artifact@v4
        with:
          name: OptGod-Android64
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || steps.latest-build.outputs.run_id }}

      - name: Validate mod package
        run: |
          set -euo pipefail
          python3 scripts/autotest_geode.py --artifact-dir artifacts --report-dir reports/package

      - name: Check launcher APK source
        id: apk-source
        env:
          ANDROID_LAUNCHER_TOKEN: ${{ secrets.ANDROID_LAUNCHER_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p reports/runtime
          if [ -n "$LAUNCHER_APK_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "mode=url" >> "$GITHUB_OUTPUT"
          elif [ -n "$ANDROID_LAUNCHER_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "mode=artifact" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            cat > reports/runtime/skipped.md <<'EOF'
          # DashCore AutoTest v2 — runtime test skipped

          Package validation completed, but no launcher APK source is configured.

          Add a fine-grained GitHub token as the DashCore repository secret
          ANDROID_LAUNCHER_TOKEN with Actions: read permission on
          hesta-lang/android-launcher, or manually dispatch AutoTest v2 with a
          direct HTTPS URL to the universal Geode Launcher APK.

          No installation or game launch test was performed.
          EOF
            echo "::warning::Runtime test skipped: configure ANDROID_LAUNCHER_TOKEN or provide a launcher APK URL."
          fi

      - name: Find latest successful Android Launcher build
        id: launcher-build
        if: ${{ steps.apk-source.outputs.mode == 'artifact' }}
        env:
          ANDROID_LAUNCHER_TOKEN: ${{ secrets.ANDROID_LAUNCHER_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          token = os.environ.get("ANDROID_LAUNCHER_TOKEN", "")
          if not token:
              raise SystemExit(
                  "Missing ANDROID_LAUNCHER_TOKEN. Add a fine-grained GitHub token "
                  "with Actions: read access to hesta-lang/android-launcher, or "
                  "manually dispatch this workflow with a direct HTTPS APK URL."
              )
          url = "https://api.github.com/repos/hesta-lang/android-launcher/actions/workflows/build.yml/runs?branch=spotify-app-remote-integration&status=success&per_page=1"
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          runs = data.get("workflow_runs", [])
          if not runs:
              raise SystemExit("No successful Android Launcher build found on spotify-app-remote-integration.")
          print(f"run_id={runs[0]['id']}")
          PY

      - name: Download Android Launcher release APK artifact
        if: ${{ steps.apk-source.outputs.mode == 'artifact' }}
        uses: actions/download-artifact@v4
        with:
          name: geode-launcher-release
          path: launcher-artifact
          github-token: ${{ secrets.ANDROID_LAUNCHER_TOKEN }}
          repository: hesta-lang/android-launcher
          run-id: ${{ steps.launcher-build.outputs.run_id }}

      - name: Prepare Geode Launcher APK
        if: ${{ steps.apk-source.outputs.available == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p test-input reports/runtime
          if [ -n "$LAUNCHER_APK_URL" ]; then
            case "$LAUNCHER_APK_URL" in
              https://*) ;;
              *) echo "APK URL must use HTTPS."; exit 1 ;;
            esac
            curl --fail --location --retry 3 --retry-all-errors \
              "$LAUNCHER_APK_URL" --output test-input/geode-launcher.apk
          else
            APK="$(find launcher-artifact -type f -name 'geode-launcher-release-*.apk' ! -name '*android32*' -print -quit)"
            if [ -z "$APK" ]; then
              echo "Universal ARM64 launcher APK was not found in the launcher artifact."
              find launcher-artifact -maxdepth 3 -type f -print || true
              exit 1
            fi
            cp "$APK" test-input/geode-launcher.apk
          fi
          test -s test-input/geode-launcher.apk
          file test-input/geode-launcher.apk

      - name: Run Android 15 emulator with ARM translation
        if: ${{ steps.apk-source.outputs.available == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          # Explicitly provision writable shared storage; without this, /sdcard/Android
          # was missing/unmounted and both Geode mod paths failed with EACCES.
          sdcard-path-or-size: 3G
          disk-size: 8G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/autotest_runtime.sh

      - name: Publish runtime logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DashCore-AutoTest-v2-${{ github.run_number }}
          path: |
            reports/
            test-input/
          if-no-files-found: warn
          retention-days: 30
