name: DashCore AutoTest v2 - Android Runtime

on:
  workflow_dispatch:
    inputs:
      launcher_apk_url:
        description: "Direct HTTPS download URL for your Geode Launcher universal ARM APK"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dashcore-runtime-autotest
  cancel-in-progress: false

jobs:
  android-runtime:
    name: Install, launch and inspect DashCore on Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAUNCHER_APK_URL: ${{ inputs.launcher_apk_url }}
      PACKAGE_NAME: com.geode.launcher
      REPORT_DIR: reports/runtime
      ARTIFACT_DIR: artifacts

    steps:
      - name: Checkout AutoTest scripts
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Find latest successful Android64 build
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/workflows/build-android64.yml/runs?branch=main&status=success&per_page=1"
          req = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          runs = data.get("workflow_runs", [])
          if not runs:
              raise SystemExit("No successful Android64 build found on main.")
          run = runs[0]
          print(f"run_id={run['id']}")
          print(f"build_sha={run['head_sha']}")
          print(f"build_url={run['html_url']}")
          print(f"Selected Android64 build: {run['id']} ({run['head_sha']})")
          PY

      - name: Download latest DashCore .geode artifact
        uses: actions/download-artifact@v4
        with:
          name: OptGod-Android64
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.latest.outputs.run_id }}

      - name: Validate mod package
        run: |
          set -euo pipefail
          python3 scripts/autotest_geode.py --artifact-dir artifacts --report-dir reports/package

      - name: Download supplied Geode Launcher APK
        run: |
          set -euo pipefail
          case "$LAUNCHER_APK_URL" in
            https://*) ;;
            *) echo "APK URL must use HTTPS."; exit 1 ;;
          esac
          mkdir -p test-input reports/runtime
          curl --fail --location --retry 3 --retry-all-errors \
            "$LAUNCHER_APK_URL" --output test-input/geode-launcher.apk
          test -s test-input/geode-launcher.apk
          file test-input/geode-launcher.apk

      - name: Run Android 15 emulator with ARM translation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/autotest_runtime.sh

      - name: Publish runtime logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DashCore-AutoTest-v2-${{ github.run_number }}
          path: |
            reports/
            test-input/
          if-no-files-found: warn
          retention-days: 30
