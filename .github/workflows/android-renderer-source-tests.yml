name: DashCore Android Renderer Source Tests

on:
  push:
    branches: ["android-renderer-source-port", "android-memory-budget"]
  pull_request:
    branches: ["android-renderer-source-port"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run renderer model tests
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/renderer_model_tests.cpp src/renderer/core/*.cpp \
            -o /tmp/dashcore-renderer-model-tests
          /tmp/dashcore-renderer-model-tests

      - name: Compile and run Android GLES capability tests
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/android_gles_capabilities_tests.cpp \
            src/renderer/core/GlesCapabilities.cpp \
            -o /tmp/dashcore-android-gles-capabilities-tests
          /tmp/dashcore-android-gles-capabilities-tests

      - name: Compile and run adaptive memory budget tests
        run: |
          set -euo pipefail
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc \
            tests/memory_budget_tests.cpp \
            src/renderer/core/MemoryBudget.cpp src/renderer/core/MemoryProbe.cpp \
            -o /tmp/dashcore-memory-budget-tests
          /tmp/dashcore-memory-budget-tests

      - name: Validate source-only renderer contract
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/test_renderer_product_contract.py
          python3 scripts/test_renderer_product_contract.py

      - name: Run Cppcheck portability analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --error-exitcode=1 \
            --language=c++ \
            --std=c++20 \
            --suppress=missingIncludeSystem \
            src/renderer
