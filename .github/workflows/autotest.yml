name: DashCore AutoTest

on:
  workflow_run:
    workflows: ["Build OptGod (Android64)"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: dashcore-autotest-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  validate-package:
    name: Validate Android64 Geode package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AutoTest scripts from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record upstream build status
        env:
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p reports
          {
            echo "# DashCore AutoTest"
            echo
            echo "- Build run: ${BUILD_RUN_ID}"
            echo "- Commit: ${BUILD_SHA}"
            echo "- Build result: ${BUILD_CONCLUSION}"
          } > reports/summary.md
          if [ "${BUILD_CONCLUSION}" != "success" ]; then
            echo >> reports/summary.md
            echo "Package validation skipped because the Android64 build did not succeed." >> reports/summary.md
            exit 1
          fi

      - name: Download Android64 package
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: OptGod-Android64
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate .geode package
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          python3 scripts/autotest_geode.py --artifact-dir artifacts --report-dir reports

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DashCore-AutoTest-Report-${{ github.event.workflow_run.run_number }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
